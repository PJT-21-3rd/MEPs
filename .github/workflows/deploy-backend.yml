name: Deploy Backend

on:
  push:
    branches: [dev]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"

env:
  IMAGE: ghcr.io/pjt-21-3rd/meps-backend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo ${{ secrets.GHCR_PAT }} | docker login ghcr.io -u tuchongkim --password-stdin
            docker pull ${{ env.IMAGE }}:latest
            docker stop meps-backend || true
            docker rm meps-backend || true
            docker run -d --name meps-backend \
              --restart unless-stopped \
              -p 8080:8080 \
              -v /home/ubuntu/deploy/config:/config:ro \
              ${{ env.IMAGE }}:latest
            docker image prune -f
