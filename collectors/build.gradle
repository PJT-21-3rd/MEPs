plugins {
    id 'java'
    id 'application'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    implementation 'com.mysql:mysql-connector-j:8.4.0'
}

application {
    mainClass = 'collectors.sinkhole.SinkholeListCollector'
}

// 건물 수집기 전용 실행 태스크 (기존 run은 그대로 둠)
tasks.register('runBuilding', JavaExec) {
    group = 'application'
    description = '건물 데이터 수집·적재'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'collectors.buildings.BuildingCollector'
    jvmArgs = ['-Xmx768m']
}